server:
  port: ${SERVER_PORT:8099}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${PAYMENT_DATABASE_USERNAME}
    password: ${PAYMENT_DATABASE_PASSWORD}
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/postgresql-live
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

payment:
  database:
    production-safety-check: true
  ledger:
    verify-on-startup: ${PAYMENT_LEDGER_VERIFY_ON_STARTUP:true}
  security:
    payment-gateway-token: ${PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:}
    cv-cover-letter-token: ${CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN:}
    stripe-gateway-token: ${STRIPE_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:}
  free-starter-tokens: ${FREE_STARTER_TOKENS:20000}
  pricing-plans:
    - id: starter
      name: Starter
      description: Good for trying AI features
      token-amount: 100000
      price-gbp-pence: 799
      active: true
      sort-order: 1
    - id: standard
      name: Standard
      description: Useful for active job searching
      token-amount: 250000
      price-gbp-pence: 1699
      active: true
      sort-order: 2
    - id: power
      name: Pro
      description: For heavy AI usage
      token-amount: 600000
      price-gbp-pence: 3499
      active: true
      sort-order: 3

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
