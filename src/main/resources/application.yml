server:
  port: ${SERVER_PORT:8099}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

payment:
  security:
    payment-gateway-token: ${PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:}
    cv-cover-letter-token: ${CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN:}
    stripe-gateway-token: ${STRIPE_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:}
  free-starter-tokens: ${FREE_STARTER_TOKENS:20000}
  pricing-plans:
    - id: starter
      name: Starter
      description: Good for trying AI features
      token-amount: 100000
      price-gbp-pence: 799
      active: true
      sort-order: 1
    - id: standard
      name: Standard
      description: Useful for active job searching
      token-amount: 250000
      price-gbp-pence: 1699
      active: true
      sort-order: 2
    - id: power
      name: Pro
      description: For heavy AI usage
      token-amount: 600000
      price-gbp-pence: 3499
      active: true
      sort-order: 3

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
