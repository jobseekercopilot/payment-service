spring.datasource.url=jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
debug=false
logging.level.root=WARN
logging.level.com.jobseekercopilot=WARN
payment.ledger.verify-on-startup=true
payment.database.production-safety-check=false
payment.security.payment-gateway-token=payment-gateway-test-token-0000000000000001
payment.security.cv-cover-letter-token=cv-cover-letter-test-token-000000000000001
payment.security.stripe-gateway-token=stripe-gateway-test-token-0000000000000001
